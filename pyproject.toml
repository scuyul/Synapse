[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reefscape-rl"
version = "0.1.0"
description = "Simplified REEFSCAPE RL simulator with AdvantageScope-friendly logging."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rl = [
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
]
viz = [
  "robotpy>=2026.2.2",
]

[tool.setuptools.packages.find]
include = ["reefscape_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
