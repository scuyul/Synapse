name: tests

on:
  push:
  pull_request:

jobs:
  lint-format:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

  python-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Compile check
        run: python -m compileall reefscape_rl scripts tests

  cpu-training-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Tiny CPU training smoke test
        run: >
          python scripts/train_ppo.py
          --timesteps 2
          --model-out models/ci_cpu_smoke
          --device cpu
          --n-envs 1
          --n-steps 2
          --batch-size 2
          --checkpoint-every-steps 0
          --skip-heuristic-pretrain
          --no-advantagescope
          --metrics-out logs/ci_cpu_smoke.jsonl
          --metrics-every-steps 1

  package-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.3.0

      - name: Build package
        run: python -m build

  dependency-audit:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit==2.9.0

      - name: pip-audit
        run: python -m pip_audit
